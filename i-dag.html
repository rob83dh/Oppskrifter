<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0E5B54">
<title>I dag</title>
<style>
:root{--paper:#E9EFE8;--card:#FFF;--ink:#131A15;--muted:#5B6A5E;--accent:#0E5B54;
 --amber:#9A6512;--line:#D3DCD1;--varsel:#8C2F1E;--gjort:#2E7D5B;
 --shadow:0 1px 2px rgba(19,26,21,.06),0 6px 18px rgba(19,26,21,.05);
 --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
 line-height:1.5;-webkit-text-size-adjust:100%;
 padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}

/* --- datolinje --- */
.datolinje{display:flex;align-items:center;gap:10px;
 padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
.pil{flex:0 0 40px;height:40px;border:1px solid var(--line);background:var(--card);
 border-radius:50%;font-size:17px;color:var(--accent);cursor:pointer;line-height:1}
.pil:disabled{opacity:.3;cursor:default}
.pil:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dtxt{flex:1;text-align:center}
.dtxt b{display:block;font-family:var(--serif);font-size:26px;letter-spacing:-.02em;line-height:1.1}
.dtxt span{font-family:var(--mono);font-size:11px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--muted)}
.idag{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;
 background:var(--accent);color:#fff;font-size:9px;letter-spacing:.09em}

/* --- kort --- */
.blokk{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--muted);margin:20px 0 8px}
.kort{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
.kort.ferdig{background:#F2F6F1}
.rad{display:flex;align-items:flex-start;gap:12px}
.hake{flex:0 0 26px;height:26px;border:2px solid var(--line);border-radius:7px;
 background:none;cursor:pointer;padding:0;position:relative;margin-top:1px}
.hake:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hake.på{background:var(--gjort);border-color:var(--gjort)}
.hake.på::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
 border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.midt{flex:1;min-width:0}
.tit{font-family:var(--serif);font-size:19px;line-height:1.25}
.kort.ferdig .tit{text-decoration:line-through;color:var(--muted)}
.und{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.mer{flex:0 0 30px;height:30px;border:1px solid var(--line);background:none;
 border-radius:50%;color:var(--accent);font-size:18px;cursor:pointer;line-height:1;padding:0}
.mer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tall{display:flex;gap:15px;margin-top:8px}
.tall i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tall i b{font-family:var(--serif);font-size:15px;font-weight:normal;color:var(--ink)}

/* --- utfelling --- */
.ut{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ut.åpen{display:block}
.notat{padding-left:11px;border-left:2px solid var(--accent);font-size:13.5px;
 color:var(--muted);margin-bottom:12px}
ul.deler{margin:0;padding-left:17px;font-size:14px}
ul.deler li{margin-bottom:3px}
ol.steg{margin:11px 0 0;padding-left:0;list-style:none;counter-reset:s}
ol.steg li{counter-increment:s;position:relative;padding-left:29px;margin-bottom:8px;font-size:14px}
ol.steg li::before{content:counter(s);position:absolute;left:0;top:1px;font-family:var(--mono);
 font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:50%;
 width:19px;height:19px;display:flex;align-items:center;justify-content:center}

/* --- ovelser --- */
.ov{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.ov:last-child{border-bottom:0}
.ovn{flex:1;font-size:14.5px;line-height:1.3}
.sett{display:flex;gap:5px}
.s{width:25px;height:25px;border-radius:50%;border:1px solid var(--accent);background:none;
 color:var(--accent);font-family:var(--mono);font-size:10px;cursor:pointer;padding:0}
.s.på{background:var(--accent);color:#fff}
.s:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.kg{width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;
 font-family:var(--mono);font-size:13px;text-align:right;background:var(--paper);color:var(--ink)}
.kg:focus{outline:none;border-color:var(--accent)}
.enh{font-family:var(--mono);font-size:10px;color:var(--muted);width:16px}
.tom{font-size:14px;color:var(--varsel);padding:4px 0}
.ov.par-start{border-bottom:0;padding-bottom:4px}
.ov.par-start,.ov.par-slutt{border-left:2px solid var(--amber);padding-left:10px;margin-left:-12px}
.ov.par-slutt{padding-top:4px}
.parmerk{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--amber);margin-top:2px}
.mangler-kg{border-color:var(--varsel)}
.pvelg{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.pvelg span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--muted)}
.pknapp{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pknapp button{border:0;background:var(--card);color:var(--muted);font-family:var(--mono);
 font-size:11px;letter-spacing:.06em;padding:6px 13px;cursor:pointer}
.pknapp button.på{background:var(--accent);color:#fff}
.pknapp button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ingtab{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.ingtab td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ingtab td.m{font-family:var(--mono);white-space:nowrap;text-align:right;
 padding-right:12px;width:74px}
.ingtab td.m.x2{color:var(--accent);font-weight:bold}
.delnavn{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
 color:var(--accent);margin:14px 0 2px}
.rest{padding-left:11px;border-left:2px solid var(--gjort);font-size:14px;color:var(--muted)}
ul.deler li.fast{color:var(--accent);font-weight:600}
.faner{display:flex;gap:22px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0;
 border-bottom:1px solid var(--line);margin-bottom:2px}
.faner button{background:none;border:0;padding:0 0 11px;cursor:pointer;font-family:var(--mono);
 font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
 border-bottom:2px solid transparent;margin-bottom:-1px}
.faner button.på{color:var(--accent);border-bottom-color:var(--accent)}
.faner button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skjult{display:none}
.avd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--accent);margin:16px 0 6px}
.vare{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.vare:last-child{border-bottom:0}
.vare.av .vn{text-decoration:line-through;color:var(--muted)}
.vhake{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:6px;background:none;
 cursor:pointer;padding:0;position:relative;margin-top:2px}
.vhake.på{background:var(--gjort);border-color:var(--gjort)}
.vhake.på::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
 border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.vn{flex:1;font-size:15px;line-height:1.3}
.vm{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.vhvor{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.basisord{display:flex;flex-wrap:wrap;gap:6px}
.basisord span{font-size:13px;padding:4px 10px;border:1px solid var(--line);
 border-radius:999px;color:var(--muted)}
.vaken{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 13px;
 border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;
 font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted)}
.vaken.på{background:var(--accent);border-color:var(--accent);color:#fff}
.vaken:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kildep{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted);
 margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}

/* --- mal for lop --- */
.mal{display:flex;gap:18px;flex-wrap:wrap}
.mal div{display:flex;flex-direction:column}
.mal i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--muted)}
.mal b{font-family:var(--serif);font-size:17px;font-weight:normal}

/* --- avvik og maling --- */
textarea{width:100%;min-height:76px;padding:11px 12px;border:1px solid var(--line);
 border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--card);
 color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.lagret{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--gjort);height:13px;margin-top:5px}
.malfelt{display:flex;gap:9px}
.malfelt label{flex:1;display:flex;flex-direction:column;gap:4px;
 font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.malfelt input{padding:10px 11px;border:1px solid var(--line);border-radius:9px;
 font-family:var(--serif);font-size:19px;background:var(--card);color:var(--ink)}
.malfelt input:focus{outline:none;border-color:var(--accent)}

/* --- dagsoppsummering --- */
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:13px 15px;box-shadow:var(--shadow);display:flex;gap:20px;flex-wrap:wrap}
.sum div{display:flex;flex-direction:column}
.sum i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--muted)}
.sum b{font-family:var(--serif);font-size:21px;font-weight:normal}
.sum b.under{color:var(--amber)}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
 font-size:12.5px;color:var(--muted)}
</style>
</head>
<body><div class="wrap">

<div class="faner" id="faner">
  <button data-s="dag" class="på">I dag</button>
  <button data-s="innkjop">Innkjøp</button>
</div>

<div id="del-dag">

</div>

  søndag 1200. Proteinmålet er 165 g.
</footer>
</div>

          }
          h += '</span><input class="kg' + (vekt ? '' : ' mangler-kg')
             + '" type="number" inputmode="decimal" step="0.5" value="'
             + (vekt || '') + '" placeholder="?" data-kg="' + nk
             + '" aria-label="Vekt i kilo for ' + esc(e.n) + '">'
             + '<span class="enh">kg</span></div>';
        }
      }
    }
    h += '</div></div>';
  }

  /* ---- maltider ---- */
  h += '<div class="blokk">Mat</div>';
  var sumk = 0, sump = 0;
  for (var m = 0; m < d.maltider.length; m++){
    var t = d.maltider[m], nm = 'mat-' + d.dato + '-' + t.id, spist = hent(nm, false);
    if (spist){ sumk += t.kc; sump += t.pr; }
    h += '<div class="kort' + (spist ? ' ferdig' : '') + '">'
       +   '<div class="rad">'
       +     '<button class="hake' + (spist ? ' på' : '') + '" data-hake="' + nm
       +       '" aria-label="Merk som spist"></button>'
       +     '<div class="midt"><div class="tit">' + esc(t.navn) + '</div>'
       +       '<div class="und">' + esc(t.kl || '') + '</div>'
       +       '<div class="tall"><i><b>' + t.kc + '</b> kcal</i>'
       +         '<i><b>' + t.pr + '</b> g protein</i></div></div>'
       +     '<button class="mer" data-ut="mat' + m + '" aria-label="Vis oppskrift">+</button>'
       +   '</div><div class="ut" id="ut-mat' + m + '">';
    if (t.oppskrift){
      h += oppskriftHTML(t, d.dato);
    } else {
      if (t.ris) h += '<div class="notat">Ris: ' + esc(t.ris) + '</div>';
      h += '<ul class="deler">';
      for (var j = 0; j < t.deler.length; j++) h += '<li>' + esc(t.deler[j]) + '</li>';
      h += '</ul>';
      if (t.steg){
        h += '<ol class="steg">';
        for (var g = 0; g < t.steg.length; g++) h += '<li>' + esc(t.steg[g]) + '</li>';
        h += '</ol>';
      }
    }
    if (t.tilb) h += '<div class="notat" style="margin-top:12px;margin-bottom:0">Mangler '
       + t.tilb + ' kcal opp til dagens mål. Fyll med ris, potet, brød eller grønnsaker i olje.</div>';
    h += '</div></div>';
  }

  var malk = (d.dato === '2026-08-09') ? 2500 : 2400;
  h += '<div class="sum">'
     +   '<div><i>Spist i dag</i><b' + (sumk < malk * 0.6 ? ' class="under"' : '')
     +     '>' + sumk + ' kcal</b></div>'
     +   '<div><i>Protein</i><b' + (sump < 100 ? ' class="under"' : '') + '>'
     +     sump + ' g</b></div>'
     +   '<div><i>Mål</i><b>' + malk + ' / 165 g</b></div>'
     + '</div>';

  /* ---- forberedelse til i morgen ---- */
  if (d.forberedelse){
    var nf = 'forb-' + d.dato, gjort = hent(nf, false);
    h += '<div class="blokk">Før du legger deg</div>'
       + '<div class="kort' + (gjort ? ' ferdig' : '') + '"><div class="rad">'
       +   '<button class="hake' + (gjort ? ' på' : '') + '" data-hake="' + nf
       +     '" aria-label="Merk som gjort"></button>'
       +   '<div class="midt"><div class="tit">' + esc(d.forberedelse.tittel) + '</div>'
       +     '<div class="notat" style="margin-top:8px;margin-bottom:0">'
       +     esc(d.forberedelse.tekst) + '</div></div>'
       + '</div></div>';
  }

  /* ---- soendagsmaling ---- */
  if (d.maling){
    h += '<div class="blokk">Søndagsmåling — om morgenen, før frokost</div>'
       + '<div class="kort"><div class="malfelt">'
       + '<label>Vekt (kg)<input type="number" inputmode="decimal" step="0.1" '
       +   'value="' + esc(hent('vekt-' + d.dato, '')) + '" data-felt="vekt-' + d.dato + '"></label>'
       + '<label>Midje (cm)<input type="number" inputmode="decimal" step="0.5" '
       +   'value="' + esc(hent('midje-' + d.dato, '')) + '" data-felt="midje-' + d.dato + '"></label>'
       + '</div></div>';
  }

  /* ---- avvik ---- */
  h += '<div class="blokk">Avvik og notater</div>'
     + '<div class="kort">'
     +   '<textarea data-notat="notat-' + d.dato + '" placeholder="Hva ble spist eller droppet? '
     +     'Hva var godt, hva var det ikke? Hvordan kjentes økta?">'
     +     esc(hent('notat-' + d.dato, '')) + '</textarea>'
     +   '<div class="lagret" id="lagret-status"></div>'
     + '</div>';

  document.getElementById('innhold').innerHTML = h;
}

/* ---- hendelser ---- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'forrige' && n > 0){ n--; tegn(); return; }
  if (b.id === 'neste' && n < U.dager.length - 1){ n++; tegn(); return; }
  if (b.dataset.hake){
    var v = !hent(b.dataset.hake, false);
    sett(b.dataset.hake, v);
    tegn();
    return;
  }
  if (b.dataset.sett){
    sett(b.dataset.sett, !hent(b.dataset.sett, false));
    b.classList.toggle('på');
    return;
  }
  if (b.dataset.s){
    var alle = document.querySelectorAll('#faner button');
    for (var q = 0; q < alle.length; q++) alle[q].classList.remove('på');
    b.classList.add('på');
    document.getElementById('del-dag').classList.toggle('skjult', b.dataset.s !== 'dag');
    document.getElementById('del-innkjop').classList.toggle('skjult', b.dataset.s !== 'innkjop');
    if (b.dataset.s === 'innkjop') tegnInnkjop();
    return;
  }
  if (b.dataset.vare){
    sett(b.dataset.vare, !hent(b.dataset.vare, false));
    tegnInnkjop();
    return;
  }
  if (b.dataset.vaken){
    if (vaken) slippVaken(); else taVaken();
    return;
  }
  if (b.dataset.pors){
    var bit = b.dataset.pors.split('|');
    sett(bit[0], parseInt(bit[1], 10));
    var apne = [];
    document.querySelectorAll('.ut.åpen').forEach(function(x){ apne.push(x.id); });
    tegn();
    apne.forEach(function(id){
      var boks = document.getElementById(id);
      if (boks){
        boks.classList.add('åpen');
        var kn = document.querySelector('[data-ut="' + id.replace('ut-','') + '"]');
        if (kn) kn.textContent = '\u2013';
      }
    });
    return;
  }
  if (b.dataset.ut){
    var boks = document.getElementById('ut-' + b.dataset.ut);
    if (boks){
      var åpen = boks.classList.toggle('åpen');
      b.textContent = åpen ? '\u2013' : '+';
    }
    return;
  }
});

document.addEventListener('change', function(e){
  if (e.target.dataset.kg)   sett(e.target.dataset.kg, parseFloat(e.target.value) || 0);
  if (e.target.dataset.felt) sett(e.target.dataset.felt, e.target.value);
});

var tid = null;
document.addEventListener('input', function(e){
  if (!e.target.dataset.notat) return;
  clearTimeout(tid);
  var nk = e.target.dataset.notat, v = e.target.value;
  tid = setTimeout(function(){
    sett(nk, v);
    var s = document.getElementById('lagret-status');
    if (s){ s.textContent = 'Lagret'; setTimeout(function(){ s.textContent = ''; }, 1600); }
  }, 400);
});

tegn();
</script>
</body></html>
